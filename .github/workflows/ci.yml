name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  repository-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync
        run: uv sync --frozen
      - name: Repository checks
        run: uv run python tools/check.py
      - name: Python tests
        run: uv run pytest -m "not integration"

  foundry-local-loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync
        run: uv sync --frozen
      - name: Prepare pinned contract artifacts
        run: uv run loveengine pilot contracts prepare --refresh-dependencies
      - name: Contract tests
        working-directory: contracts
        run: forge test
      - name: Local-loop integration
        run: uv run pytest tests/test_demo.py

  m3-network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync
        run: uv sync --frozen
      - name: Prepare pinned contract artifacts
        run: uv run loveengine pilot contracts prepare --refresh-dependencies
      - name: Three-node network integration
        run: uv run pytest tests/integration/test_network_demo.py

  m4-live-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync
        run: uv sync --frozen
      - name: Prepare pinned contract artifacts
        run: uv run loveengine pilot contracts prepare --refresh-dependencies
      - name: Live evidence integration
        run: uv run pytest tests/integration/test_live_evidence_demo.py

  m5-package-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync
        run: uv sync --frozen
      - name: Prepare pinned contract artifacts
        run: uv run loveengine pilot contracts prepare --refresh-dependencies
      - name: Build twice and verify deterministic package
        id: package
        shell: bash
        run: |
          first_build="$(uv run loveengine package build --output dist-a)"
          second_build="$(uv run loveengine package build --output dist-b)"
          FIRST_BUILD="$first_build" SECOND_BUILD="$second_build" uv run python - <<'PY'
          import json
          import os
          from pathlib import Path

          first = json.loads(os.environ["FIRST_BUILD"])
          second = json.loads(os.environ["SECOND_BUILD"])
          for field in ("archive_sha256", "archive_keccak256"):
              if first[field] != second[field]:
                  raise SystemExit(f"non-deterministic package {field}")

          archive = Path(first["archive"])
          if not archive.is_file():
              raise SystemExit(f"package archive not found: {archive}")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              print(f"archive={archive}", file=output)
              print(f"package_hash={first['archive_keccak256']}", file=output)
          PY
          archive="$(FIRST_BUILD="$first_build" uv run python -c \
            'import json, os; print(json.loads(os.environ["FIRST_BUILD"])["archive"])')"
          package_hash="$(FIRST_BUILD="$first_build" uv run python -c \
            'import json, os; print(json.loads(os.environ["FIRST_BUILD"])["archive_keccak256"])')"
          uv run loveengine package verify \
            "$archive" \
            --expected-package-hash "$package_hash"
      - name: Package security and CLI integration tests
        run: |
          uv run pytest tests/test_skill_package.py
          uv run pytest tests/test_cli_commands.py::test_package_cli_build_verify_install_and_self_check
      - name: Clean install and frozen sync
        run: |
          uv run loveengine package install \
            "${{ steps.package.outputs.archive }}" \
            --target installed \
            --expected-package-hash "${{ steps.package.outputs.package_hash }}"
          uv sync --frozen --project installed
          uv run --project installed loveengine package self-check \
            --root installed \
            --expected-package-hash "${{ steps.package.outputs.package_hash }}"

  m5-lan-pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync
        run: uv sync --frozen
      - name: Prepare pinned contract artifacts
        run: uv run loveengine pilot contracts prepare --refresh-dependencies
      - name: Persistent chain integration
        run: uv run pytest tests/integration/test_pilot_chain.py
      - name: Unified package-to-PublicSink E2E
        run: uv run pytest tests/integration/test_pilot_demo.py
      - name: Public Quickstart and node-connect integration
        run: uv run pytest tests/integration/test_pilot_quickstart.py
      - name: Accelerated faults and ten-observer soak
        run: uv run pytest tests/integration/test_pilot_soak.py
